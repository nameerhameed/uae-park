<title>UAE Park</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single phone-width column, road-sign blue header band, three tabs (Pay / Vehicles / History) */
:root{
  --bg:#eef2f8; --surface:#ffffff; --sunk:#e3e9f2; --line:#cfd8e5;
  --fg:#0f1a2b; --muted:#5a6880; --accent:#0a4ea2; --accent-fg:#ffffff;
  --sign:#0a4ea2; --plate:#fbfcfe; --plate-line:#1b2433;
  --ok:#137a46; --ok-bg:#dff3e8; --warn:#a85c00; --warn-bg:#fdeed8; --bad:#b42318; --bad-bg:#fde4e1;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131d30; --sunk:#0f1828; --line:#24324b;
  --fg:#e6ecf5; --muted:#93a1b8; --accent:#4d8fe6; --accent-fg:#06101f;
  --sign:#0d3f82; --plate:#eef2f7; --plate-line:#0f1a2b;
  --ok:#5fd394; --ok-bg:#12321f; --warn:#f2b45a; --warn-bg:#3a2a10; --bad:#ff8a7e; --bad-bg:#3b1612;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131d30; --sunk:#0f1828; --line:#24324b;
  --fg:#e6ecf5; --muted:#93a1b8; --accent:#4d8fe6; --accent-fg:#06101f;
  --sign:#0d3f82; --plate:#eef2f7; --plate-line:#0f1a2b;
  --ok:#5fd394; --ok-bg:#12321f; --warn:#f2b45a; --warn-bg:#3a2a10; --bad:#ff8a7e; --bad-bg:#3b1612;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.band{background:var(--sign);color:#fff;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 0}
.wrap{max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.pmark{width:42px;height:42px;border:3px solid #fff;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase}
.brand p{margin:0;font-size:13px;opacity:.8}
.tabs{display:flex;gap:4px;margin-top:16px}
.tab{flex:1;border:0;background:transparent;color:#fff;opacity:.72;padding:10px 0 12px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;border-bottom:3px solid transparent}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:#fff}
.tab .count{font-family:var(--body);font-size:12px;font-weight:600;background:rgba(255,255,255,.2);border-radius:99px;padding:1px 7px;margin-left:4px;letter-spacing:0}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
section.panel{display:flex;flex-direction:column;gap:18px}
.label{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.block{display:flex;flex-direction:column}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.seg b{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.02em}
.seg small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.85}

.cars{display:flex;flex-wrap:wrap;gap:8px}
.carchip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px 8px 8px;display:flex;align-items:center;gap:10px;text-align:left}
.carchip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.carchip .who{display:flex;flex-direction:column;line-height:1.15}
.carchip .who b{font-weight:600;font-size:15px}
.carchip .who span{font-size:12px;color:var(--muted)}
.tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.carchip[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tick svg{width:12px;height:12px;opacity:0}
.carchip[aria-pressed="true"] .tick svg{opacity:1}

/* number plate */
.plate{display:inline-flex;align-items:stretch;background:var(--plate);color:#0f1a2b;border:2px solid var(--plate-line);border-radius:5px;font-family:var(--display);font-weight:700;line-height:1;overflow:hidden;flex:none}
.plate .em{font-family:var(--body);font-size:8px;font-weight:600;letter-spacing:.06em;writing-mode:vertical-rl;transform:rotate(180deg);padding:3px 2px;border-right:1.5px solid var(--plate-line);text-transform:uppercase}
.plate .cd{padding:5px 6px;font-size:18px;border-right:1.5px solid var(--plate-line);min-width:24px;text-align:center}
.plate .nm{padding:5px 8px;font-size:18px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.plate.lg .cd,.plate.lg .nm{font-size:24px;padding:7px 9px}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.input.code{font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.zones{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.zone{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:4px 10px;font-family:var(--mono);font-size:13px}

.hours{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:transparent;width:46px;height:46px;font-size:22px;font-weight:600}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper output{min-width:74px;text-align:center;font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.stepper output small{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.quick{display:flex;gap:6px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:40px;height:36px;font-weight:600}
.quick button[aria-pressed="true"]{background:var(--sunk);border-color:var(--accent);color:var(--accent)}

.ptype{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ptype button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:left}
.ptype button b{display:block;font-weight:600}
.ptype button span{font-size:12px;color:var(--muted)}
.ptype button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}

.sms{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sms-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.to{font-size:13px;color:var(--muted)}
.to b{font-family:var(--mono);color:var(--fg);font-size:15px}
.smstext{font-family:var(--mono);font-size:17px;background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:12px;width:100%;resize:none;letter-spacing:.03em;min-height:52px}
.smstext:not([readonly]){border-color:var(--warn)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);flex:1 1 160px}
.btn.primary[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 10px;font-size:14px}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty p{margin:0;color:var(--muted)}

.active{display:flex;flex-direction:column;gap:10px}
.timer{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.timer.soon{border-left-color:var(--warn)}
.timer.over{border-left-color:var(--bad)}
.timer .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.timer .meta b{font-weight:600}
.timer .meta span{font-size:13px;color:var(--muted)}
.left{font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.left small{display:block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.timer .actions{grid-column:1/-1}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--ok-bg);color:var(--ok)}
.pill.soon{background:var(--warn-bg);color:var(--warn)}
.pill.over{background:var(--bad-bg);color:var(--bad)}

.vlist{display:flex;flex-direction:column;gap:10px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vcard .who{flex:1 1 120px;min-width:0}
.vcard .who b{display:block}
.vcard .who span{font-size:13px;color:var(--muted)}
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.form h2{margin:0;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.02em}
.preview{display:flex;align-items:center;gap:10px;padding:12px;background:var(--sunk);border-radius:10px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.hlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hitem{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:12px;border-top:1px solid var(--line);align-items:center}
.hitem:first-child{border-top:0}
.hitem .when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hitem .what{min-width:0}
.hitem .what b{font-weight:600}
.hitem code{font-family:var(--mono);font-size:12px;color:var(--muted);display:block;overflow-wrap:anywhere}
.tag{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:2px 6px}

.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin:0}
.store{margin:0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.store::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.store[data-s="cloud"]::before,.store[data-s="device"]::before{background:var(--ok)}
.store[data-s="error"]::before,.store[data-s="off"]::before{background:var(--bad)}
.spots{display:flex;gap:8px;flex-wrap:wrap}
.spot{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left}
.spot b{font-weight:600;font-size:15px}
.spot span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.spot[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.spot .sug{font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.savespot{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.savespot .input{flex:1 1 160px;padding:8px 10px}
.fee{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.fee .amt{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.fee .amt small{font-size:18px;margin-right:4px;color:var(--muted)}
.fee .rate{text-align:right;font-size:13px;color:var(--muted)}
.fee .rate b{display:block;color:var(--fg);font-size:15px}
.fee .why{grid-column:1/-1;font-size:13px;color:var(--muted);margin:6px 0 0}
.fee.free{border-color:var(--ok);background:var(--ok-bg)}
.fee.free .amt{color:var(--ok)}
.fee .each{grid-column:1/-1;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.timer,.sms{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<header class="band">
  <div class="wrap">
    <div class="brand">
      <div class="pmark" aria-hidden="true">P</div>
      <div><h1>UAE Park</h1><p>Parking by SMS · Dubai · Sharjah · Abu Dhabi · Ajman</p></div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-pay" aria-selected="true" data-tab="pay">Pay</button>
      <button class="tab" role="tab" id="tab-veh" aria-selected="false" data-tab="veh">Vehicles<span class="count" id="vcount">0</span></button>
      <button class="tab" role="tab" id="tab-his" aria-selected="false" data-tab="his">History</button>
    </nav>
  </div>
</header>

<main><div class="wrap">
  <!-- PAY -->
  <section class="panel" id="p-pay">
    <div class="active" id="active"></div>

    <div class="block">
      <p class="label">Where are you parking?</p>
      <div class="seg" id="emirates"></div>
    </div>

    <div class="block">
      <p class="label">Vehicles</p>
      <div id="carpick"></div>
    </div>

    <div class="block" id="zoneBlock">
      <p class="label">Zone code</p>
      <input class="input code" id="zone" placeholder="e.g. 365C" autocomplete="off" autocapitalize="characters" maxlength="8">
      <div class="zones" id="zones"></div>
      <p class="hint">Printed on the blue Parkin sign next to your bay. The letter sets the price.</p>
    </div>

    <div class="block" id="spotBlock">
      <p class="label">My spots</p>
      <div class="spots" id="spots"></div>
      <div class="savespot" id="saveSpot">
        <input class="input" id="spotName" placeholder="Name this spot, e.g. Office" maxlength="20">
        <button class="btn small" type="button" id="spotSave">Save spot</button>
      </div>
    </div>

    <div class="block" id="typeBlock">
      <p class="label">Mawaqif type</p>
      <div class="ptype" id="ptype">
        <button type="button" data-t="S" aria-pressed="true"><b>Standard</b><span>Blue &amp; black kerb</span></button>
        <button type="button" data-t="P" aria-pressed="false"><b>Premium</b><span>Blue &amp; white kerb</span></button>
      </div>
    </div>

    <div class="block" id="hoursBlock">
      <p class="label">Duration</p>
      <div class="hours">
        <div class="stepper">
          <button type="button" id="hMinus" aria-label="Less time">−</button>
          <output id="hOut">1<small>hr</small></output>
          <button type="button" id="hPlus" aria-label="More time">+</button>

        <div class="quick" id="quick"></div>

      <p class="label">Ready to send</p>

    <p class="note" id="emNote"></p>

  <!-- VEHICLES -->
  <section class="panel" id="p-veh" hidden>
    <div class="vlist" id="vlist"></div>
    <form class="form" id="vform" autocomplete="off">
      <h2 id="vformTitle">Add a vehicle</h2>
      <div class="row">
        <div class="field"><label for="vNick">Nickname</label><input class="input" id="vNick" placeholder="My Car" required maxlength="24"></div>
        <div class="field"><label for="vOwner">Belongs to</label><input class="input" id="vOwner" placeholder="Me, Dad, Cousin" maxlength="24" list="owners"></div>
        <datalist id="owners"><option value="Me"><option value="Dad"><option value="Cousin"></datalist>
      </div>

        <select class="input" id="vSrc">
          <option value="DXB">Dubai</option><option value="SHJ">Sharjah</option><option value="AUH">Abu Dhabi</option>
          <option value="AJM">Ajman</option><option value="RAK">Ras Al Khaimah</option><option value="UAQ">Umm Al Quwain</option><option value="FUJ">Fujairah</option>
        </select>
      </div>
      <div class="row">
        <div class="field"><label for="vCode">Plate code</label><input class="input code" id="vCode" placeholder="A" required maxlength="3"></div>
        <div class="field"><label for="vNum">Plate number</label><input class="input code" id="vNum" placeholder="12345" required inputmode="numeric" pattern="[0-9]{1,6}" maxlength="6"></div>
      </div>

        <button class="btn ghost" type="button" id="vCancel" hidden>Cancel</button>

    <div class="stats" id="stats"></div>
    <div id="hlist"></div>

  </section>
</div></main>
<div class="toast" id="toast" hidden></div>

<script>
const KEY='uaepark.v1';
const EMIRATE_NAMES={DXB:'Dubai',SHJ:'Sharjah',AUH:'Abu Dhabi',AJM:'Ajman',RAK:'RAK',UAQ:'UAQ',FUJ:'Fujairah'};
const EM={
  dxb:{name:'Dubai',to:'7275',min:1,max:24,
    build:(v,o)=>v.src==='DXB'?`${v.code}${v.num} ${o.zone} ${o.h}`:`${v.src} ${v.code} ${v.num} ${o.zone} ${o.h}`,
    ext:(s)=>({to:'7275',body:s.base.replace(/\s\d+$/,' 1'),label:'Send +1 hr'}),
    note:'Parkin texts a reminder before your ticket ends. To add time here, the app sends a fresh 1-hour SMS for the same plate and zone.'},
  shj:{name:'Sharjah',to:'5566',min:1,max:24,
    build:(v,o)=>`${v.src} ${v.num} ${o.h}`,
    ext:()=>({to:'5566',body:'Y',label:'Reply Y · +1 hr'}),
    note:'No zone code needed in Sharjah. Paid hours now run 8 am to midnight. You will get a reminder SMS; reply Y to add an hour.'},
  auh:{name:'Abu Dhabi',to:'3009',min:1,max:24,
    build:(v,o)=>`${v.src}${v.code} ${v.num} ${o.type} ${o.h}`,
    ext:()=>({to:'3009',body:'E',label:'Send E · +1 hr'}),
    note:'Works from du and e& numbers. Mawaqif sends a reminder 10 minutes before expiry; send E to add an hour.'},
  ajm:{name:'Ajman',to:'5155',min:1,max:1,
    build:(v)=>`${v.src} ${v.code} ${v.num}`,
    ext:()=>({to:'5155',body:'Y',label:'Reply Y · +1 hr'}),
    note:'Ajman SMS parking is one hour per message. Reply Y to 5155 before it ends to add another hour.'}
};

/* ---------- fees (official published tariffs, Oct 2026) ---------- */
const SMS_FEE={dxb:0.30,shj:0.38,auh:0.30,ajm:0.38};
const DXB_T={
  A:{std:{pk:[4,8,12,16],op:[4,8,12,16]},pr:{pk:[6,12,18,24],op:[4,8,12,16]}},
  B:{std:{pk:[4,8,12,16],op:[3,6,9,12]},pr:{pk:[6,12,18,24],op:[3,6,9,12]},day:{std:30,pr:40}},
  C:{std:{pk:[4,8,12,16],op:[2,5,8,11]},pr:{pk:[6,12,18,24],op:[2,5,8,11]}},
  D:{std:{pk:[4,8,12,16],op:[2,4,5,7]},pr:{pk:[6,12,18,24],op:[2,4,6,7]},day:{std:20,pr:30}},
  E:{flat:[10,20,30,40]},F:{flat:[4,8,12,16,20,24,28],day:32},G:{flat:[2,5,8,11]},H:{flat:[4,8,12,16]},
  I:{flat:[10,20,30,40]},J:{flat:[4,8,12,22]},K:{flat:[4,8,12,16,20,24,28],day:32},L:{flat:[4,8,12,22]},X:{flat:[4,8,12,16]}
};
function lookup(t,h,cap){let v;if(h<=t.length)v=t[h-1];else{const l=t[t.length-1],p=t.length>1?t[t.length-2]:0;v=l+(l-p)*(h-t.length);}return cap?Math.min(v,cap):v;}
const hr=d=>d.getHours()+d.getMinutes()/60;
function quote(em,o,d=new Date()){
  const h=o.h, day=d.getDay(), x=hr(d);
  const fmtT=n=>{const t=new Date(d);t.setHours(n,0,0,0);return t.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});};
  if(em==='dxb'){
    if(day===0)return{free:true,why:'Sunday: Dubai public parking is free all day (multi-storey car parks still charge).'};
    if(x<8||x>=22)return{free:true,why:`Free until ${fmtT(8)}. Paid hours are 8 am to 10 pm.`};
    const m=(o.zone||'').match(/^\d*([A-Z])(P?)$/);
    if(!m)return{unknown:true,why:'Enter the zone code to see the price.'};
    const t=DXB_T[m[1]];if(!t)return{unknown:true,why:`Zone letter ${m[1]} isn't in the tariff list. Check the sign for the price.`};
    const peak=(x>=8&&x<10)||(x>=16&&x<20);
    if(t.flat){const a=lookup(t.flat,h,t.day);return{amt:a,rate:`Zone ${m[1]}`,why:`Special zone ${m[1]} flat rate.`};}
    const tier=m[2]?'pr':'std', tab=t[tier][peak?'pk':'op'];
    const a=lookup(tab,h,t.day?t.day[tier]:0);
    return{amt:a,rate:`Zone ${m[1]}${m[2]?' Premium':''} · ${peak?'Peak':'Off-peak'}`,why:peak?'Peak rate applies 8–10 am and 4–8 pm.':'Off-peak rate. Peak is 8–10 am and 4–8 pm.'};
  }
  if(em==='shj'){
    if(day===5)return{free:true,why:'Friday: free in regular zones. Blue-sign 7-day zones still charge, so check the sign.',alt:shjFee(h)};
    if(x<8)return{free:true,why:`Free until ${fmtT(8)}. Paid hours are 8 am to midnight.`,alt:shjFee(h)};
    return{amt:shjFee(h),rate:'Standard street parking',why:'Smart parking yards (Al Khan, Al Nad) price differently.'};
  }
  if(em==='auh'){
    if(day===0)return{free:true,why:'Sunday: Mawaqif parking is free all day.'};
    if(x<8)return{free:true,why:`Free until ${fmtT(8)}. Paid hours are 8 am to midnight.`};
    if(o.type==='P')return{amt:3*h,rate:'Premium · AED 3/hr',why:'Premium bays allow up to 4 hours.'};
    return{amt:Math.min(2*h,15),rate:'Standard · AED 2/hr',why:'Standard bays cap at AED 15 for the day.'};
  }
  if(em==='ajm'){
    if(day===5)return{free:true,why:'Friday: Ajman public parking is free all day.'};
    if(x<8||x>=22)return{free:true,why:`Free until ${fmtT(8)}. Paid hours are 8 am–1 pm and 5–10 pm.`};
    if(x>=13&&x<17)return{free:true,why:`Free until ${fmtT(17)}. There's a free break from 1 to 5 pm.`};
    return{amt:2,rate:'AED 2/hr',why:'SMS buys one hour at a time.'};
  }
}
function shjFee(h){return h<=3?[2,5,8][h-1]:Math.min(8+3*(h-3),15);}
const aed=n=>(Math.round(n*100)/100).toLocaleString('en-AE',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});

let S={vehicles:[],history:[],zones:[],spots:[],em:'shj'};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
/* Storage: inside Claude, everything is saved to your account (survives closing the app, works on any device).
   As a standalone home-screen app, it's saved on the phone. */
let framed=false;try{framed=window.self!==window.top;}catch(e){framed=true;}
const IN_CLAUDE=!!(window.claude&&window.claude.use)||framed||/claude|anthropic/i.test(location.hostname);
const waitClaude=()=>new Promise(r=>{let n=0;(function t(){if(window.claude&&window.claude.use)return r(true);if(++n>30)return r(false);setTimeout(t,100);})();});
let cloud=null, cloudTimer=null, storeState=IN_CLAUDE?'connecting':'device';
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(cloud){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>{
    cloud.set(JSON.parse(JSON.stringify(S))).then(()=>setStore('cloud')).catch(()=>setStore('error'));
  },400);}
}
function setStore(s){storeState=s;const el=$('store');if(!el)return;
  const t={cloud:'Saved to your Claude account',device:'Saved on this phone',connecting:'Connecting to your saved data…',error:'Couldn’t save to your account. Changes stay on this screen until you reopen.',off:'Not signed in. Vehicles won’t be kept after you close this.'}[s];
  el.textContent=t;el.dataset.s=s;}
async function connectCloud(){
  if(!IN_CLAUDE||!(await waitClaude()))return setStore(IN_CLAUDE?'off':'device');
  try{
    const [user,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    const id=user&&db?await user.id():null;
    if(!id)return setStore('off');
    const ref=db.doc(`data/users/${id}/state`);
    const snap=await ref.get();
    cloud=ref;
    if(snap.exists){
      const d=snap.data()||{};
      // keep anything added on this screen before the account data loaded
      const local=S;S=Object.assign({vehicles:[],history:[],zones:[],spots:[],em:'shj'},JSON.parse(JSON.stringify(d)));
      local.vehicles.forEach(v=>{if(!S.vehicles.find(x=>x.id===v.id))S.vehicles.push(v);});
      local.spots.forEach(v=>{if(!S.spots.find(x=>x.id===v.id))S.spots.push(v);});
      local.history.forEach(v=>{if(!S.history.find(x=>x.id===v.id))S.history.push(v);});
      S.history.sort((a,b)=>b.ts-a.ts);
    }
    save();setStore('cloud');
    renderVehicles();applySuggestion();renderPay();if(!$('p-his').hidden)renderHistory();
  }catch(e){setStore('error');}
}

S.spots=S.spots||[];
let sel=new Set(), hours=1, ptype='S', editId=null, spotId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const plate=(v,lg)=>`<span class="plate${lg?' lg':''}" aria-label="${esc(EMIRATE_NAMES[v.src]||v.src)} ${esc(v.code)} ${esc(v.num)}"><span class="em">${esc(EMIRATE_NAMES[v.src]||v.src)}</span><span class="cd">${esc(v.code)||'·'}</span><span class="nm">${esc(v.num)||'00000'}</span></span>`;
const smsHref=(to,body)=>`sms:${to}&body=${encodeURIComponent(body)}`;
const tickSvg='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>';

function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200);}
async function copy(text,el){
  try{await navigator.clipboard.writeText(text);toast('Copied');}
  catch(e){ if(el&&el.select){el.removeAttribute('readonly');el.select();el.setAttribute('readonly','');} toast('Press and hold to copy'); }
}

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function showTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  $('p-pay').hidden=t!=='pay';$('p-veh').hidden=t!=='veh';$('p-his').hidden=t!=='his';
  if(t==='his')renderHistory();
  try{localStorage.setItem(KEY+'.tab',t);}catch(e){}
}

/* ---------- pay ---------- */
function renderEmirates(){
  $('emirates').innerHTML=Object.entries(EM).map(([k,e])=>`<button type="button" data-k="${k}" aria-pressed="${S.em===k}"><b>${e.name}</b><small>${e.to}</small></button>`).join('');
  $('emirates').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.em=b.dataset.k;save();spotId=null;$('zone').value='';hours=Math.min(Math.max(hours,EM[S.em].min),EM[S.em].max);applySuggestion();renderPay();});
}
function renderCarPick(){
  const box=$('carpick');
  if(!S.vehicles.length){
    box.innerHTML=`<div class="empty"><p>No vehicles yet. Add your car, your dad's and your cousin's once, then just tap to pick them here.</p><button class="btn primary" type="button" id="goAdd" style="flex:none">Add a vehicle</button></div>`;
    $('goAdd').onclick=()=>{showTab('veh');$('vNick').focus();};return;
  }
  [...sel].forEach(id=>{if(!S.vehicles.find(v=>v.id===id))sel.delete(id);});
  if(!sel.size&&S.vehicles.length===1)sel.add(S.vehicles[0].id);
  box.innerHTML=`<div class="cars">${S.vehicles.map(v=>`<button type="button" class="carchip" data-id="${v.id}" aria-pressed="${sel.has(v.id)}"><span class="tick">${tickSvg}</span>${plate(v)}<span class="who"><b>${esc(v.nick)}</b><span>${esc(v.owner||'')}</span></span></button>`).join('')}</div><p class="hint">Tap more than one to pay for several cars. Each car gets its own SMS.</p>`;
  box.querySelectorAll('.carchip').forEach(b=>b.onclick=()=>{const id=b.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);renderCarPick();renderReady();});
}
function renderZones(){
  $('zones').innerHTML=S.zones.slice(0,6).map(z=>`<button type="button" class="zone" data-z="${esc(z)}">${esc(z)}</button>`).join('');
  $('zones').querySelectorAll('.zone').forEach(b=>b.onclick=()=>{$('zone').value=b.dataset.z;spotId=null;renderSpots();renderReady();});
}

/* ---------- spots: saved places, suggested from your own history ---------- */
function suggestSpot(em){
  const now=new Date(), x=hr(now), wk=now.getDay(), best={};
  S.history.forEach(h=>{
    if(!h.spotId||(em&&h.em!==em))return;
    const d=new Date(h.ts), dx=Math.abs(hr(d)-x);
    let w=1; if(dx<=1.5)w+=4; else if(dx<=3)w+=1;
    if(d.getDay()===wk)w+=2;
    best[h.spotId]=(best[h.spotId]||0)+w;
  });
  const top=Object.entries(best).filter(([id])=>S.spots.find(s=>s.id===id)).sort((a,b)=>b[1]-a[1])[0];
  return top?{id:top[0],score:top[1]}:null;
}
let suggestedId=null, hereId=null;
/* GPS (home-screen version only — the Claude app blocks location) */
const CAN_GPS=!IN_CLAUDE&&'geolocation' in navigator;
function locate(){return new Promise(r=>{if(!CAN_GPS)return r(null);
  navigator.geolocation.getCurrentPosition(p=>r(p.coords),()=>r(null),{enableHighAccuracy:true,timeout:10000,maximumAge:60000});});}
function dist(a,b){const R=6371e3,t=x=>x*Math.PI/180,dLa=t(b.lat-a.latitude),dLo=t(b.lng-a.longitude);
  const h=Math.sin(dLa/2)**2+Math.cos(t(a.latitude))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function nearestSpot(c){let best=null;S.spots.forEach(s=>{if(s.lat==null)return;const d=dist(c,s);if(d<=Math.max(150,Math.min(c.accuracy||0,400))&&(!best||d<best.d))best={s,d};});return best;}
async function findMySpot(manual){
  const c=await locate();
  if(!c){if(manual)toast('Location is off. Allow it in Settings → Safari → Location.');return;}
  const n=nearestSpot(c);
  if(!n){hereId=null;if(manual)toast('No saved spot near you. Save this one below.');renderSpots();return;}
  hereId=n.s.id;S.em=n.s.em;$('zone').value='';spotId=null;useSpot(n.s);renderPay();
  toast(`You're at ${n.s.name}`);
}
function useSpot(s){
  spotId=s.id;
  if(s.em==='dxb')$('zone').value=s.zone||'';
  if(s.em==='auh'){ptype=s.type||'S';$('ptype').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t===ptype));}
  if(s.hours&&s.em!=='ajm')hours=Math.min(s.hours,EM[s.em].max);
}
function applySuggestion(){
  const sg=suggestSpot(S.em);suggestedId=sg?sg.id:null;
  if(sg&&!spotId&&!$('zone').value){useSpot(S.spots.find(s=>s.id===sg.id));}
}
function renderSpots(){
  const list=S.spots.filter(s=>s.em===S.em);
  const gpsBtn=CAN_GPS&&S.spots.some(s=>s.lat!=null)?`<button type="button" class="spot" id="findMe"><span class="sug">Location</span><b>Find my spot</b><span>Uses GPS</span></button>`:'';
  $('spots').innerHTML=gpsBtn+(list.length?list.map(s=>`<button type="button" class="spot" data-id="${s.id}" aria-pressed="${spotId===s.id}">${hereId===s.id?'<span class="sug">You’re here</span>':suggestedId===s.id?'<span class="sug">Suggested now</span>':''}<b>${esc(s.name)}</b><span>${S.em==='dxb'?esc(s.zone):S.em==='auh'?(s.type==='P'?'Premium':'Standard'):''}${s.hours?` · ${s.hours}h`:''}</span></button>`).join('')
    :`<p class="hint" style="margin:0">Save the places you park often. ${CAN_GPS?'Each spot remembers its location, so next time the app picks it as soon as you open it there.':'After a few visits the app pre-selects the right one for the time of day.'}</p>`);
  const fm=$('findMe');if(fm)fm.onclick=()=>findMySpot(true);
  $('spots').querySelectorAll('.spot[data-id]').forEach(b=>b.onclick=()=>{
    const s=S.spots.find(x=>x.id===b.dataset.id);
    if(spotId===s.id){spotId=null;}else useSpot(s);
    renderSpots();renderHours();renderReady();
  });
  const cur=S.spots.find(s=>s.id===spotId);
  $('saveSpot').innerHTML=cur
    ?`<button class="btn small ghost danger" type="button" id="spotDel">Remove “${esc(cur.name)}”</button><button class="btn small ghost" type="button" id="spotUpd">Update with current settings</button>`
    :`<input class="input" id="spotName" placeholder="Name this spot, e.g. Office" maxlength="20"><button class="btn small" type="button" id="spotSave">Save spot</button>`;
  if(cur){
    const del=$('spotDel');
    del.onclick=()=>{if(del.dataset.arm){S.spots=S.spots.filter(s=>s.id!==cur.id);spotId=null;save();renderSpots();toast('Spot removed');return;}del.dataset.arm='1';del.textContent='Tap again to remove';setTimeout(()=>{if(del.isConnected){delete del.dataset.arm;del.textContent=`Remove “${cur.name}”`;}},3000);};
    $('spotUpd').onclick=async()=>{if(S.em==='dxb'&&!$('zone').value.trim()){toast('Enter the zone code first');return;}cur.zone=$('zone').value.trim();cur.type=ptype;cur.hours=hours;
      const c=await locate();if(c){cur.lat=c.latitude;cur.lng=c.longitude;}
      save();renderSpots();toast(c?'Spot updated with your current location':'Spot updated');};
  }else{
    $('spotSave').onclick=async()=>{
      const name=$('spotName').value.trim();
      if(!name){toast('Give the spot a name');$('spotName').focus();return;}
      if(S.em==='dxb'&&!$('zone').value.trim()){toast('Enter the zone code first');$('zone').focus();return;}
      const s={id:uid(),em:S.em,name,zone:$('zone').value.trim(),type:ptype,hours};
      const c=await locate();if(c){s.lat=c.latitude;s.lng=c.longitude;hereId=s.id;}
      S.spots.push(s);spotId=s.id;save();renderSpots();toast(c?`${name} saved with this location`:`${name} saved`);
    };
  }
}

function renderFee(){
  const box=$('fee'), n=Math.max(1,S.vehicles.filter(v=>sel.has(v.id)).length);
  const q=quote(S.em,{h:S.em==='ajm'?1:hours,zone:$('zone').value.trim(),type:ptype});
  const sms=SMS_FEE[S.em];
  if(q.unknown){box.innerHTML=`<div class="fee"><span class="amt"><small>AED</small>–</span><span class="rate"></span><p class="why">${esc(q.why)}</p></div>`;return;}
  if(q.free){box.innerHTML=`<div class="fee free"><span class="amt">Free now</span><span class="rate">${q.alt?`<b>AED ${aed(q.alt)}</b>if it's a 7-day zone`:''}</span><p class="why">${esc(q.why)} You don't need to send an SMS.</p></div>`;return;}
  const total=(q.amt+sms)*n;
  box.innerHTML=`<div class="fee"><span class="amt"><small>AED</small>${aed(total)}</span><span class="rate"><b>${esc(q.rate)}</b>${S.em==='ajm'?1:hours} hr${hours>1&&S.em!=='ajm'?'s':''}</span>
    <p class="each">AED ${aed(q.amt)} parking + about ${Math.round(sms*100)} fils SMS${n>1?` · × ${n} cars`:''}</p>
    <p class="why">${esc(q.why)} Estimate from published rates; the confirmation SMS shows the final charge.</p></div>`;
}
function renderHours(){
  const e=EM[S.em], max=maxH();
  hours=Math.min(hours,max);
  $('hOut').innerHTML=`${hours}<small>hr${hours>1?'s':''}</small>`;
  $('hMinus').disabled=hours<=e.min;$('hPlus').disabled=hours>=max;
  const q=[1,2,3,4].filter(n=>n<=max);
  $('quick').innerHTML=q.length>1?q.map(n=>`<button type="button" data-h="${n}" aria-pressed="${hours===n}">${n}h</button>`).join(''):'';
  $('quick').querySelectorAll('button').forEach(b=>b.onclick=()=>{hours=+b.dataset.h;renderHours();renderReady();});
  $('hoursHint').textContent=S.em==='ajm'?'Ajman SMS covers one hour at a time.':'';
}
$('hMinus').onclick=()=>{hours=Math.max(EM[S.em].min,hours-1);renderHours();renderReady();};
const maxH=()=>S.em==='auh'&&ptype==='P'?4:EM[S.em].max;
$('hPlus').onclick=()=>{hours=Math.min(maxH(),hours+1);renderHours();renderReady();};
$('zone').addEventListener('input',()=>{$('zone').value=$('zone').value.toUpperCase().replace(/\s/g,'');renderReady();});
$('ptype').querySelectorAll('button').forEach(b=>b.onclick=()=>{ptype=b.dataset.t;$('ptype').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderHours();renderReady();});

function renderReady(){
  renderFee();
  const e=EM[S.em], box=$('ready');
  const cars=S.vehicles.filter(v=>sel.has(v.id));
  const zone=$('zone').value.trim();
  if(!cars.length){
    const sample={src:'DXB',code:'A',num:'12345'};
    box.innerHTML=`<div class="sms" style="opacity:.6"><div class="sms-head"><span class="to">To <b>${e.to}</b></span><span class="tag">Example</span></div><div class="smstext">${esc(e.build(sample,{zone:zone||'365C',h:hours,type:ptype}))}</div><p class="hint" style="margin:0">${S.vehicles.length?'Pick a vehicle above.':'Add a vehicle to get your real SMS.'}</p></div>`;
    return;
  }
  const needZone=S.em==='dxb'&&!zone;
  box.innerHTML=cars.map(v=>{
    const body=e.build(v,{zone:zone||'ZONE',h:hours,type:ptype});
    return `<div class="sms" data-id="${v.id}">
      <div class="sms-head">${plate(v)}<span class="to">To <b>${e.to}</b> · ${esc(v.nick)}</span></div>
      <textarea class="smstext" rows="1" readonly aria-label="SMS text for ${esc(v.nick)}">${esc(body)}</textarea>
      <div class="actions">
        ${IN_CLAUDE
          ?`<button class="btn primary copy" type="button" ${needZone?'aria-disabled="true"':''}>Copy SMS</button><button class="btn copyto" type="button">Copy ${e.to}</button>`
          :`<a class="btn primary send" href="${smsHref(e.to,body)}" aria-disabled="${needZone}">Open Messages</a><button class="btn copy" type="button">Copy text</button>`}
        <button class="btn ghost small edit" type="button">Edit</button>
      </div>
      ${needZone?'<p class="hint" style="margin:0">Enter the zone code first.</p>':IN_CLAUDE?`<p class="hint" style="margin:0">Then open Messages, paste it and send to <b>${e.to}</b>.</p>`:''}
    </div>`;}).join('');
  box.querySelectorAll('.sms').forEach(card=>{
    const ta=card.querySelector('textarea'), a=card.querySelector('.send'), v=S.vehicles.find(x=>x.id===card.dataset.id);
    ta.oninput=()=>{if(a)a.href=smsHref(e.to,ta.value);};
    card.querySelector('.edit').onclick=ev=>{if(ta.hasAttribute('readonly')){ta.removeAttribute('readonly');ta.focus();ev.target.textContent='Done';}else{ta.setAttribute('readonly','');ev.target.textContent='Edit';}};
    card.querySelector('.copy').onclick=()=>{copy(ta.value,ta);logSession(v,ta.value);};
    const ct=card.querySelector('.copyto');if(ct)ct.onclick=()=>copy(e.to);
    if(a)a.onclick=()=>logSession(v,ta.value);
  });
}

function logSession(v,body){
  const e=EM[S.em], now=Date.now();
  // ignore a duplicate tap within 20 s
  const dup=S.history.find(h=>h.vid===v.id&&h.sms===body&&now-h.ts<20000);
  if(dup)return;
  const h=S.em==='ajm'?1:hours;
  const q=quote(S.em,{h,zone:$('zone').value.trim(),type:ptype});
  const amt=(q.amt||0)+SMS_FEE[S.em];
  S.history.unshift({id:uid(),ts:now,em:S.em,vid:v.id,nick:v.nick,plate:{src:v.src,code:v.code,num:v.num},hours:h,to:e.to,sms:body,base:body,ends:now+h*3600e3,zone:S.em==='dxb'?$('zone').value.trim():'',type:ptype,spotId,amt});
  if(S.em==='dxb'){const z=$('zone').value.trim();if(z){S.zones=[z,...S.zones.filter(x=>x!==z)].slice(0,8);}}
  S.history=S.history.slice(0,300);save();renderZones();renderSpots();renderActive();
  setTimeout(()=>toast(IN_CLAUDE?'Copied. Paste in Messages to '+e.to+'. Timer started.':'Timer started. Check for the confirmation SMS.'),60);
}

/* Calendar reminder: an event at expiry with an alert 10 min before (opens iPhone's "Add to Calendar") */
function addReminder(h){
  const f=d=>new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const x=EM[h.em].ext(h), place=EM[h.em].name+(h.zone?' '+h.zone:'');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//UAE Park//EN','BEGIN:VEVENT',
    `UID:${h.id}-${h.ends}@uaepark`,`DTSTAMP:${f(Date.now())}`,`DTSTART:${f(h.ends)}`,`DTEND:${f(h.ends+5*60e3)}`,
    `SUMMARY:Parking ends · ${h.nick} (${place})`,
    `DESCRIPTION:To add 1 hour send "${x.body}" to ${x.to}.`,
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Parking ends in 10 minutes','TRIGGER:-PT10M','END:VALARM',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Parking ends now','TRIGGER:PT0M','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  location.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
}

function fmtLeft(ms){
  const neg=ms<0;ms=Math.abs(ms);const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;
  const hh=Math.floor(m/60),mm=m%60;
  return (neg?'−':'')+(hh?`${hh}:${String(mm).padStart(2,'0')}`:`${mm}:${String(s).padStart(2,'0')}`);
}
function renderActive(){
  const now=Date.now();
  const list=S.history.filter(h=>!h.done&&h.ends>now-15*60e3);
  const box=$('active');
  if(!list.length){box.innerHTML='';return;}
  box.innerHTML=`<p class="label" style="margin:0">Parked now</p>`+list.map(h=>{
    const left=h.ends-now, cls=left<0?'over':left<15*60e3?'soon':'';
    const x=EM[h.em].ext(h);
    return `<div class="timer ${cls}" data-id="${h.id}">
      <div class="meta"><b>${esc(h.nick)} · ${EM[h.em].name}${h.zone?' · '+esc(h.zone):''}</b><span>${h.amt?`≈ AED ${aed(h.amt)} so far · `:''}Until ${new Date(h.ends).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} <span class="pill ${cls}">${left<0?'Expired':cls?'Ending soon':'Active'}</span></span></div>
      <div class="left" data-left>${fmtLeft(left)}<small>left</small></div>
      <div class="actions">
        <a class="btn small primary ext" href="${smsHref(x.to,x.body)}" style="flex:0 1 auto">${x.label}</a>
        ${IN_CLAUDE?'':'<button class="btn small cal" type="button">Remind me</button>'}
        <button class="btn small done" type="button">I've left</button>
      </div></div>`;}).join('');
  box.querySelectorAll('.timer').forEach(t=>{
    const h=S.history.find(x=>x.id===t.dataset.id);
    t.querySelector('.ext').onclick=()=>{
      const add=quote(h.em,{h:1,zone:h.zone,type:h.type||'S'},new Date(h.ends));
      h.amt=(h.amt||0)+(add.amt||0)+SMS_FEE[h.em];
      h.ends=Math.max(h.ends,Date.now())+3600e3;h.hours+=1;save();setTimeout(renderActive,50);toast('Added 1 hour to the timer');};
    const cal=t.querySelector('.cal');if(cal)cal.onclick=()=>addReminder(h);
    t.querySelector('.done').onclick=()=>{h.done=true;h.left=Date.now();save();renderActive();};
  });
}
setInterval(()=>{
  const now=Date.now();
  document.querySelectorAll('.timer').forEach(t=>{
    const h=S.history.find(x=>x.id===t.dataset.id);if(!h)return;
    const left=h.ends-now, el=t.querySelector('[data-left]');
    el.firstChild.nodeValue=fmtLeft(left);
    const want=left<0?'over':left<15*60e3?'soon':'';
    if(!t.classList.contains(want||'x')&&(want||t.classList.contains('soon')||t.classList.contains('over')))renderActive();
  });
},1000);

function renderPay(){
  if(S.em==='auh'&&ptype==='P')hours=Math.min(hours,4);
  renderEmirates();renderCarPick();renderZones();renderSpots();renderHours();
  $('zoneBlock').hidden=S.em!=='dxb';$('typeBlock').hidden=S.em!=='auh';
  $('emNote').textContent=EM[S.em].note;
  renderReady();renderActive();
}

/* ---------- vehicles ---------- */
const CODE_HINT={DXB:'A',SHJ:'3',AUH:'5',AJM:'B',RAK:'C',UAQ:'A',FUJ:'F'};
function formVehicle(){return{nick:$('vNick').value.trim(),owner:$('vOwner').value.trim(),src:$('vSrc').value,code:$('vCode').value.trim().toUpperCase(),num:$('vNum').value.trim()};}
function renderPrev(){const v=formVehicle();$('vCode').placeholder=CODE_HINT[v.src]||'A';$('vPrev').innerHTML=plate(v,true);}
['vNick','vOwner','vSrc','vCode','vNum'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='vCode')$('vCode').value=$('vCode').value.toUpperCase();if(id==='vNum')$('vNum').value=$('vNum').value.replace(/\D/g,'');renderPrev();}));

$('vform').addEventListener('submit',ev=>{
  ev.preventDefault();const v=formVehicle();
  if(!v.nick||!v.code||!v.num){toast('Fill in nickname, plate code and number');return;}
  if(editId){Object.assign(S.vehicles.find(x=>x.id===editId),v);toast('Vehicle updated');}
  else{const nv={id:uid(),...v};S.vehicles.push(nv);sel.add(nv.id);toast(`${v.nick} added`);}
  save();resetForm();renderVehicles();renderPay();
});
$('vCancel').onclick=resetForm;
function resetForm(){editId=null;$('vform').reset();$('vformTitle').textContent='Add a vehicle';$('vSave').textContent='Save vehicle';$('vCancel').hidden=true;renderPrev();}

function renderVehicles(){
  $('vcount').textContent=S.vehicles.length;
  const box=$('vlist');
  if(!S.vehicles.length){box.innerHTML=`<div class="empty"><p>Your saved cars show up here. Add each one once with its nickname, plate emirate, code and number.</p></div>`;return;}
  box.innerHTML=`<p class="label" style="margin:0">Saved vehicles</p>`+S.vehicles.map(v=>`<div class="vcard" data-id="${v.id}">${plate(v,true)}<div class="who"><b>${esc(v.nick)}</b><span>${esc(v.owner||'—')}</span></div><div class="actions"><button class="btn small ed" type="button">Edit</button><button class="btn small ghost danger del" type="button">Delete</button></div></div>`).join('');
  box.querySelectorAll('.vcard').forEach(c=>{
    const v=S.vehicles.find(x=>x.id===c.dataset.id);
    c.querySelector('.ed').onclick=()=>{editId=v.id;$('vNick').value=v.nick;$('vOwner').value=v.owner||'';$('vSrc').value=v.src;$('vCode').value=v.code;$('vNum').value=v.num;$('vformTitle').textContent='Edit '+v.nick;$('vSave').textContent='Save changes';$('vCancel').hidden=false;renderPrev();$('vform').scrollIntoView({behavior:'smooth',block:'start'});};
    const del=c.querySelector('.del');
    del.onclick=()=>{
      if(del.dataset.arm){S.vehicles=S.vehicles.filter(x=>x.id!==v.id);sel.delete(v.id);save();renderVehicles();renderPay();toast('Vehicle deleted');return;}
      del.dataset.arm='1';del.textContent='Tap again to delete';setTimeout(()=>{if(del.isConnected){delete del.dataset.arm;del.textContent='Delete';}},3000);
    };
  });
}

/* ---------- history ---------- */
function renderHistory(){
  const h=S.history, now=new Date();
  const month=h.filter(x=>{const d=new Date(x.ts);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
  const hrs=month.reduce((a,x)=>a+x.hours,0);
  const spent=month.reduce((a,x)=>a+(x.amt||0),0);
  $('stats').innerHTML=`<div class="stat"><b>${month.length}</b><span>Sessions this month</span></div><div class="stat"><b>${hrs}</b><span>Hours this month</span></div><div class="stat"><b>${aed(spent)}</b><span>AED this month (est.)</span></div>`;
  if(!h.length){$('hlist').innerHTML=`<div class="empty"><p>Every SMS you open or copy from the Pay tab is logged here with the time, car and exact message.</p></div>`;$('clearHis').hidden=true;return;}
  $('clearHis').hidden=false;
  $('hlist').innerHTML=`<div class="hlist">${h.slice(0,100).map(x=>{const d=new Date(x.ts);return `<div class="hitem"><span class="tag">${EM[x.em].name}</span><div class="what"><b>${esc(x.nick)}</b> · ${x.hours} hr${x.hours>1?'s':''}${x.amt?` · ≈ AED ${aed(x.amt)}`:''}${x.spotId&&S.spots.find(s=>s.id===x.spotId)?` · ${esc(S.spots.find(s=>s.id===x.spotId).name)}`:''}<code>${esc(x.to)} ← ${esc(x.sms)}</code></div><span class="when">${d.toLocaleDateString([], {day:'numeric',month:'short'})}<br>${d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</span></div>`;}).join('')}</div>`;
}
$('clearHis').onclick=function(){
  if(this.dataset.arm){S.history=[];save();renderHistory();renderActive();delete this.dataset.arm;this.textContent='Clear history';toast('History cleared');return;}
  this.dataset.arm='1';this.textContent='Tap again to clear all';setTimeout(()=>{delete this.dataset.arm;this.textContent='Clear history';},3000);
};

/* ---------- boot ---------- */
(function bootSuggest(){
  // jump to the emirate you usually park in at this time of day
  let best=null;Object.keys(EM).forEach(k=>{const s=suggestSpot(k);if(s&&(!best||s.score>best.score))best={...s,em:k};});
  if(best&&best.score>=5)S.em=best.em;
  applySuggestion();
})();
renderPrev();renderVehicles();renderPay();setStore(storeState);connectCloud();
// home-screen version: if location was allowed before, jump straight to the spot you're standing at
if(CAN_GPS&&S.spots.some(s=>s.lat!=null)){
  (navigator.permissions&&navigator.permissions.query?navigator.permissions.query({name:'geolocation'}).then(p=>p.state).catch(()=>'prompt'):Promise.resolve('prompt'))
    .then(st=>{if(st==='granted')findMySpot(false);});
}
try{const t=localStorage.getItem(KEY+'.tab');if(t&&t!=='pay')showTab(t);}catch(e){}
</script>
